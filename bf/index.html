<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>وصل البلاك فرايدي — عيادة د. محمد حسين يحيى</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="وصل البلاك فرايدي — عيادة د. محمد حسين يحيى">
<meta property="og:description" content="تخفيض البلاك فرايدي محجوز باسمكم. افتحوا الرابط واحفظوا الوصل.">
<meta property="og:image" content="https://clinic.mirbadtech.com/img/brand/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F3A5F;--navy-d:#172C49;--red:#FE0013;--ink:#1d2433;--muted:#5d6678;--bg:#f6f8fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 14px 40px}
#receipt{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 8px 30px rgba(23,44,73,.18);background:#fff}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:14px 10px;font:600 16px "IBM Plex Sans Arabic",sans-serif;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.hint{color:var(--muted);font-size:14px;text-align:center;margin-top:12px;line-height:1.7}
.msg{background:#fff;border-radius:16px;padding:28px 20px;text-align:center;line-height:1.9;box-shadow:0 4px 18px rgba(23,44,73,.08)}
.msg img{width:220px;max-width:70%;margin-bottom:12px}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <div id="loading" class="msg"><img src="/img/brand/logo.png" alt=""><br>جاري تحميل الوصل…</div>
  <div id="error" class="msg hidden"><img src="/img/brand/logo.png" alt=""><br><b>ما لكينا هذا الوصل.</b><br>تأكدوا من الرابط، او تواصلوا ويانا على <a href="tel:07760547911" dir="ltr">07760547911</a></div>
  <div id="view" class="hidden">
    <img id="receipt" alt="وصل البلاك فرايدي">
    <div class="actions">
      <button class="btn primary" id="save">حفظ الوصل كصورة</button>
      <button class="btn ghost" id="share">مشاركة</button>
    </div>
    <p class="hint">احتفظوا بهذا الوصل واعرضوه بالاستقبال من تجون للعيادة.<br>على الآيفون: اضغطوا على الصورة ضغطة مطولة ← "حفظ في الصور".</p>
  </div>
</main>
<script>
const API_KEY = "AIzaSyAQzHXmXnUFJT2-wfz7WSqN3dOprWe4C1g";
const BASE = "https://firestore.googleapis.com/v1/projects/yahya-dental-clinic/databases/(default)/documents/receipts/";
const W = 1080, H = 1700;
const FONT = '"IBM Plex Sans Arabic", sans-serif';
const toAr = s => String(s).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function wrap(ctx, text, maxW){
  const words = text.split(" "); const lines = []; let line = "";
  for (const w of words){ const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}

async function draw(data){
  await document.fonts.load('700 40px "IBM Plex Sans Arabic"');
  await document.fonts.load('500 40px "IBM Plex Sans Arabic"');
  const [logo, iti, inv] = await Promise.all(["/img/brand/logo.png", "/img/brand/iti.png", "/img/brand/invisalign.png"].map(loadImg));
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d"); ctx.direction = "rtl"; ctx.textBaseline = "alphabetic";
  const R = W - 80; // right edge for RTL text

  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  // header logo
  const lw = 760, lh = lw * logo.height / logo.width; ctx.drawImage(logo, (W - lw) / 2, 50, lw, lh);

  // navy band
  const bandY = 50 + lh + 30;
  ctx.fillStyle = "#1F3A5F"; ctx.fillRect(0, bandY, W, 210);
  ctx.fillStyle = "#FE0013"; ctx.fillRect(0, bandY + 210, W, 10);
  ctx.textAlign = "center"; ctx.fillStyle = "#fff";
  ctx.font = `700 76px ${FONT}`; ctx.fillText("وصل البلاك فرايدي", W / 2, bandY + 100);
  ctx.font = `500 40px ${FONT}`; ctx.fillStyle = "#dbe4f0"; ctx.fillText("تخفيض البلاك فرايدي محجوز باسمكم", W / 2, bandY + 165);

  // details card
  let y = bandY + 280;
  roundRect(ctx, 60, y, W - 120, 380, 28); ctx.fillStyle = "#f6f8fb"; ctx.fill();
  ctx.strokeStyle = "#e6e9ef"; ctx.lineWidth = 3; ctx.stroke();
  const rows = [
    ["الاسم", data.name],
    ["رقم الهاتف", data.phone || "—"],
    ["رقم الوصل", data.code],
    ["تاريخ التسجيل", data.date],
  ];
  ctx.textAlign = "right";
  rows.forEach(([k, v], i) => {
    const ry = y + 80 + i * 86;
    ctx.font = `500 36px ${FONT}`; ctx.fillStyle = "#5d6678"; ctx.fillText(k, R - 30, ry);
    ctx.font = `700 42px ${FONT}`; ctx.fillStyle = "#1d2433";
    ctx.textAlign = "left";
    if (k === "رقم الوصل" || k === "رقم الهاتف") ctx.direction = "ltr";
    let val = v; while (ctx.measureText(val).width > 560 && val.length > 4) val = val.slice(0, -2) + "…";
    ctx.fillText(val, 110, ry);
    ctx.direction = "rtl"; ctx.textAlign = "right";
    if (i < rows.length - 1){ ctx.fillStyle = "#e6e9ef"; ctx.fillRect(100, ry + 30, W - 200, 2); }
  });

  // offers
  y += 440;
  ctx.font = `700 44px ${FONT}`; ctx.fillStyle = "#1F3A5F"; ctx.fillText("التخفيضات المشمولة", R, y);
  ctx.fillStyle = "#FE0013"; ctx.fillRect(R - 120, y + 18, 120, 6);
  const offers = [
    "زراعة الاسنان: لحد ٥٠٪",
    "التقويم الشفاف انفزلاين: لحد ٢٠٪",
    "التغليف والابتسامة: ٥٠٪",
    "الاستشارة وفتح الفايل: مجاناً",
  ];
  ctx.font = `500 38px ${FONT}`;
  offers.forEach((o, i) => {
    const oy = y + 90 + i * 64;
    ctx.fillStyle = "#FE0013"; ctx.beginPath(); ctx.arc(R - 12, oy - 12, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1d2433"; ctx.fillText(o, R - 40, oy);
  });

  // note
  y += 90 + offers.length * 64 + 10;
  roundRect(ctx, 60, y, W - 120, 150, 22); ctx.fillStyle = "#fff4f5"; ctx.fill();
  ctx.fillStyle = "#1d2433"; ctx.font = `500 34px ${FONT}`;
  const note = "التخفيض يستخدم مرة وحدة لما تراجعون العيادة، حتى لو اكثر من علاج. اعرضوا هذا الوصل بالاستقبال من تجون للعيادة.";
  wrap(ctx, note, W - 200).forEach((l, i) => ctx.fillText(l, R - 20, y + 60 + i * 50));

  // badges
  y += 185;
  const bh = 84; const iw = bh * iti.width / iti.height; const vw = bh * inv.width / inv.height;
  const gap = 70, total = iw + vw + gap, bx = (W - total) / 2;
  ctx.drawImage(iti, bx, y, iw, bh); ctx.drawImage(inv, bx + iw + gap, y, vw, bh);

  // footer
  const fy = H - 120;
  ctx.fillStyle = "#172C49"; ctx.fillRect(0, fy, W, 120);
  ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = `500 30px ${FONT}`;
  ctx.fillText("البصرة، الخليلية، شارع ١٤ تموز، مجمع تموز التجاري، الطابق الثالث", W / 2, fy + 50);
  ctx.fillText("07760547911  ·  السبت – الخميس، ٤ العصر – ١٠ بالليل", W / 2, fy + 95);
  return c;
}

function fmtPhone(p){
  let d = String(p).replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/\D/g, "");
  if (d.startsWith("00964")) d = d.slice(5); else if (d.startsWith("964")) d = d.slice(3);
  if (d.length === 10 && d[0] === "7") d = "0" + d;
  return d;
}

function fmtDate(iso){
  const d = new Date(iso);
  try { return d.toLocaleDateString("ar-IQ", { year: "numeric", month: "long", day: "numeric", timeZone: "Asia/Baghdad" }); }
  catch(e){ return toAr(d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear()); }
}

async function main(){
  const p = new URLSearchParams(location.search);
  const id = (p.get("r") || "").trim();
  let data;
  if (p.get("demo") === "1"){
    data = { name: "محمد حسين علي", phone: "07701234567", code: "BF-DEMO01", date: fmtDate(new Date().toISOString()) };
  } else {
    if (!/^[A-Za-z0-9]{6,40}$/.test(id)) throw new Error("bad id");
    const r = await fetch(BASE + id + "?key=" + API_KEY);
    if (!r.ok) throw new Error("not found");
    const doc = await r.json(); const f = doc.fields || {};
    data = {
      name: (f.name && f.name.stringValue || "").trim(),
      phone: fmtPhone(f.phone && f.phone.stringValue || ""),
      code: "BF-" + id.slice(0, 6).toUpperCase(),
      date: fmtDate(doc.createTime),
    };
    if (!data.name) throw new Error("empty");
  }
  const canvas = await draw(data);
  const url = canvas.toDataURL("image/jpeg", 0.92);
  const img = document.getElementById("receipt"); img.src = url;
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("view").classList.remove("hidden");
  const fname = "wasl-" + data.code + ".jpg";
  document.getElementById("save").onclick = () => { const a = document.createElement("a"); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); };
  const shareBtn = document.getElementById("share");
  canvas.toBlob(blob => {
    const file = new File([blob], fname, { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      shareBtn.onclick = () => navigator.share({ files: [file], title: "وصل البلاك فرايدي" }).catch(() => {});
    } else shareBtn.classList.add("hidden");
  }, "image/jpeg", 0.92);
}

main().catch(() => {
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("error").classList.remove("hidden");
});
</script>
</body>
</html>
